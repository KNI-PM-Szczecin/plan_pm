[project]
name = "plan-pm-backend"
version = "0.1.0"
description = "PlanPM backend — scrapes the Maritime University of Szczecin schedule into Supabase, with a local Flask admin panel and an MCP server."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.13",
    "fastmcp>=2.0",
    "flask>=3.0",
    "pillow>=11.0",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "rich>=14.0",
    "supabase>=2.18",
    "google-api-python-client>=2.197.0",
    "google-auth>=2.53.0",
    "pyjwt[crypto]>=2.10",
]

[project.optional-dependencies]
# Test framework — not needed for the pipeline/admin runtime. Install with
# `pip install -e ".[dev]"` (or `uv sync --extra dev`).
dev = [
    "pytest>=9.0",
]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests that make real network calls (deselect with -m 'not slow')",
]
