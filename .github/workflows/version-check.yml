name: Version bump check

on:
  pull_request:
    branches: [production, deployment]

jobs:
  version-check:
    name: Verify pubspec.yaml version is bumped
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR version
        id: pr
        run: |
          VERSION=$(grep '^version:' frontend/pubspec.yaml | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get production version
        id: main
        run: |
          git fetch origin ${{ github.base_ref }}
          VERSION=$(git show origin/${{ github.base_ref }}:frontend/pubspec.yaml | grep '^version:' | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Compare versions
        run: |
          PR="${{ steps.pr.outputs.version }}"
          MAIN="${{ steps.main.outputs.version }}"
          echo "main: $MAIN"
          echo "PR:   $PR"
          PR_VERSION=${PR%%+*}
          MAIN_VERSION=${MAIN%%+*}
          PR_BUILD=${PR##*+}
          MAIN_BUILD=${MAIN##*+}
          if [ "$PR_VERSION" = "$MAIN_VERSION" ] || [ "$(printf '%s\n%s\n' "$MAIN_VERSION" "$PR_VERSION" | sort -V | head -n1)" != "$MAIN_VERSION" ]; then
            echo "❌ Marketing version must increase. Found $MAIN_VERSION → $PR_VERSION"
            exit 1
          fi
          if ! [[ "$PR_BUILD" =~ ^[0-9]+$ && "$MAIN_BUILD" =~ ^[0-9]+$ ]] || [ "$PR_BUILD" -le "$MAIN_BUILD" ]; then
            echo "❌ Build number must increase independently. Found $MAIN_BUILD → $PR_BUILD"
            exit 1
          fi
          echo "✅ Version and build bumped: $MAIN → $PR"
