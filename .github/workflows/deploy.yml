name: Deploy to App Store & Play Store

on:
  push:
    branches: [deployment]

jobs:
  ios:
    name: iOS → TestFlight
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Flutter dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Generate secrets.dart
        env:
          SUPABASE_PROD_URL: ${{ secrets.SUPABASE_PROD_URL }}
          SUPABASE_PROD_ANON_KEY: ${{ secrets.SUPABASE_PROD_ANON_KEY }}
        run: |
          {
            printf "import 'env_config.dart';\n\n"
            printf "class Secrets {\n"
            printf "  static const String supabaseUrl = kSimulateNetworkErrors\n"
            printf "      ? \"http://localhost:9999\"\n"
            printf "      : \"%s\";\n" "$SUPABASE_PROD_URL"
            printf "  static const String supabaseAnonKey = kSimulateNetworkErrors\n"
            printf "      ? \"invalid_key\"\n"
            printf "      : \"%s\";\n" "$SUPABASE_PROD_ANON_KEY"
            printf "}\n"
          } > frontend/lib/secrets.dart

      - name: Install CocoaPods dependencies
        working-directory: frontend/ios
        run: pod install

      - name: Decode certificate
        working-directory: frontend/ios
        run: |
          echo "${{ secrets.IOS_CERTIFICATE_BASE64 }}" | base64 --decode > certificate.p12

      - name: Decode provisioning profile
        working-directory: frontend/ios
        run: |
          echo "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > profile.mobileprovision

      - name: Install Ruby dependencies
        working-directory: frontend/ios
        run: bundle install

      - name: Run Fastlane beta
        working-directory: frontend/ios
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          CI: true
        run: bundle exec fastlane ios beta

  android:
    name: Android → Play Store
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: frontend/android

      - name: Install Flutter dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Generate secrets.dart
        env:
          SUPABASE_PROD_URL: ${{ secrets.SUPABASE_PROD_URL }}
          SUPABASE_PROD_ANON_KEY: ${{ secrets.SUPABASE_PROD_ANON_KEY }}
        run: |
          {
            printf "import 'env_config.dart';\n\n"
            printf "class Secrets {\n"
            printf "  static const String supabaseUrl = kSimulateNetworkErrors\n"
            printf "      ? \"http://localhost:9999\"\n"
            printf "      : \"%s\";\n" "$SUPABASE_PROD_URL"
            printf "  static const String supabaseAnonKey = kSimulateNetworkErrors\n"
            printf "      ? \"invalid_key\"\n"
            printf "      : \"%s\";\n" "$SUPABASE_PROD_ANON_KEY"
            printf "}\n"
          } > frontend/lib/secrets.dart

      - name: Decode keystore
        working-directory: frontend/android
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > upload-keystore.jks

      - name: Run Fastlane deploy
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: bundle exec fastlane android deploy
