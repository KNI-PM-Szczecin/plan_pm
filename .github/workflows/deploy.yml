name: Deploy to App Store & Play Store

on:
  push:
    branches: [deployment]

jobs:
  ios:
    name: iOS → TestFlight
    if: "!contains(github.event.head_commit.message, '[skip deploy]') && !contains(github.event.head_commit.message, '[skip ios]')"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Flutter dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Generate secrets.dart
        env:
          SUPABASE_PROD_URL: ${{ secrets.SUPABASE_PROD_URL }}
          SUPABASE_PROD_ANON_KEY: ${{ secrets.SUPABASE_PROD_ANON_KEY }}
        run: |
          python3 << 'EOF'
          import os
          url = os.environ['SUPABASE_PROD_URL'].strip()
          key = os.environ['SUPABASE_PROD_ANON_KEY'].strip()
          lines = [
              "import 'env_config.dart';",
              "",
              "class Secrets {",
              "  static const String supabaseUrl = kSimulateNetworkErrors",
              '      ? "http://localhost:9999"',
              f'      : "{url}";',
              "  static const String supabaseAnonKey = kSimulateNetworkErrors",
              '      ? "invalid_key"',
              f'      : "{key}";',
              "}",
          ]
          with open('frontend/lib/secrets.dart', 'w') as f:
              f.write('\n'.join(lines) + '\n')
          EOF

      - name: Install CocoaPods dependencies
        working-directory: frontend/ios
        run: pod install

      - name: Decode certificate
        working-directory: frontend/ios
        run: |
          echo "${{ secrets.IOS_CERTIFICATE_BASE64 }}" | base64 --decode > certificate.p12

      - name: Decode provisioning profile
        working-directory: frontend/ios
        run: |
          echo "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > profile.mobileprovision

      - name: Install Ruby dependencies
        working-directory: frontend/ios
        run: bundle install

      - name: Run Fastlane beta
        working-directory: frontend/ios
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          CI: true
        run: bundle exec fastlane ios beta

  android:
    name: Android → Play Store
    if: "!contains(github.event.head_commit.message, '[skip deploy]') && !contains(github.event.head_commit.message, '[skip android]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: frontend/android

      - name: Install Flutter dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Generate secrets.dart
        env:
          SUPABASE_PROD_URL: ${{ secrets.SUPABASE_PROD_URL }}
          SUPABASE_PROD_ANON_KEY: ${{ secrets.SUPABASE_PROD_ANON_KEY }}
        run: |
          python3 << 'EOF'
          import os
          url = os.environ['SUPABASE_PROD_URL'].strip()
          key = os.environ['SUPABASE_PROD_ANON_KEY'].strip()
          lines = [
              "import 'env_config.dart';",
              "",
              "class Secrets {",
              "  static const String supabaseUrl = kSimulateNetworkErrors",
              '      ? "http://localhost:9999"',
              f'      : "{url}";',
              "  static const String supabaseAnonKey = kSimulateNetworkErrors",
              '      ? "invalid_key"',
              f'      : "{key}";',
              "}",
          ]
          with open('frontend/lib/secrets.dart', 'w') as f:
              f.write('\n'.join(lines) + '\n')
          EOF

      - name: Decode keystore
        working-directory: frontend/android
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > upload-keystore.jks

      - name: Run Fastlane deploy
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: bundle exec fastlane android deploy
