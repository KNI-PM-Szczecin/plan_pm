name: Check env mode

on:
  pull_request:
    branches: [main]

jobs:
  check-env-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sprawdź tryb środowiska
        run: |
          MODE=$(cat backend/.env_mode | tr -d '[:space:]')
          if [ "$MODE" != "prod" ]; then
            echo "❌ Nieprawidłowy tryb środowiska: '$MODE' (wymagany: prod)."
            echo "   Uruchom: python scripts/switch_env.py prod"
            exit 1
          fi
          echo "✅ Tryb: $MODE"
